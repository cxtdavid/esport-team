<form action="#" method="post">
  <label for="nome">Nome</label>
  <input type="text" id="nome" name="nome">

  <label for="email">Email</label>
  <input type="email" id="email" name="email">

  <label for="data">Data preferita</label>
  <input type="date" id="data" name="data">

  <label for="motivo">Motivo del contatto</label>
  <select id="motivo" name="motivo">
    <option value="sponsor">Sponsorizzazione</option>
    <option value="info">Informazioni</option>
  </select>

  <label for="messaggio">Messaggio</label>
  <textarea id="messaggio" name="messaggio" rows="4"></textarea>

  <button type="submit">Invia</button>
</form>
